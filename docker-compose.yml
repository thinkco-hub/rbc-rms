services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rbc_rms
      POSTGRES_USER: rbc
      POSTGRES_PASSWORD: rbc
    ports:
      - "5432:5432"
    volumes:
      - rbc_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rbc_redis_data:/data

volumes:
  rbc_postgres_data:
  rbc_redis_data: